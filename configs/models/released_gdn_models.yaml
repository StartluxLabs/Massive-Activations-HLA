# Released controlled-pretraining GDN checkpoints.
#
# These are intended for reproducing controlled PAS/ISP and output-gating
# figures. By default, checkpoints are loaded from the public HuggingFace repo
# startlux-models/Massive-Activations-HLA with one checkpoint per subfolder.
# Baseline and no-output-gate models use public FLA v0.5.2. The two gated-FA
# entries are weights-only unless metadata.inference_code is explicitly set to
# a compatible local implementation; see README.md.
models:
  gdn_340m_pas_layer04:
    family: GatedDeltaNet
    adapter: released_gdn
    hf_id: startlux-models/Massive-Activations-HLA
    subfolder: gdn-340m-pas-fa-layer04-10b
    scale: 340M
    num_layers: 24
    full_attention_layers: [4]
    metadata:
      group: controlled_pas
      train_tokens: 10B

  gdn_340m_pas_layer12:
    family: GatedDeltaNet
    adapter: released_gdn
    hf_id: startlux-models/Massive-Activations-HLA
    subfolder: gdn-340m-pas-fa-layer12-10b
    scale: 340M
    num_layers: 24
    full_attention_layers: [12]
    metadata:
      group: controlled_pas
      train_tokens: 10B

  gdn_340m_pas_layer20:
    family: GatedDeltaNet
    adapter: released_gdn
    hf_id: startlux-models/Massive-Activations-HLA
    subfolder: gdn-340m-pas-fa-layer20-10b
    scale: 340M
    num_layers: 24
    full_attention_layers: [20]
    metadata:
      group: controlled_pas
      train_tokens: 10B

  gdn_1p3b_pas_layer12:
    family: GatedDeltaNet
    adapter: released_gdn
    hf_id: startlux-models/Massive-Activations-HLA
    subfolder: gdn-1.3b-pas-fa-layer12-50b
    scale: 1.3B
    num_layers: 24
    full_attention_layers: [12]
    metadata:
      group: controlled_pas
      train_tokens: 50B

  gdn_340m_isp_3to1:
    family: GatedDeltaNet
    adapter: released_gdn
    hf_id: startlux-models/Massive-Activations-HLA
    subfolder: gdn-340m-isp-hybrid-3to1-10b
    scale: 340M
    hybrid_ratio: "3:1"
    num_layers: 24
    full_attention_layers: [3, 6, 9, 12, 15, 18, 21, 24]
    metadata:
      group: controlled_isp
      train_tokens: 10B

  gdn_1p3b_isp_3to1:
    family: GatedDeltaNet
    adapter: released_gdn
    hf_id: startlux-models/Massive-Activations-HLA
    subfolder: gdn-1.3b-isp-hybrid-3to1-50b
    scale: 1.3B
    hybrid_ratio: "3:1"
    num_layers: 24
    full_attention_layers: [3, 6, 9, 12, 15, 18, 21, 24]
    metadata:
      group: controlled_isp
      train_tokens: 50B

  gdn_gatedfa_340m_pas_layer12:
    family: GatedDeltaNet
    adapter: released_gdn
    hf_id: startlux-models/Massive-Activations-HLA
    subfolder: gdn-gatedfa-340m-pas-fa-layer12-10b
    scale: 340M
    num_layers: 24
    full_attention_layers: [12]
    metadata:
      group: controlled_gating
      variant: gated_fa
      train_tokens: 10B

  gdn_nooutgate_340m_pas_layer12:
    family: GatedDeltaNet
    adapter: released_gdn
    hf_id: startlux-models/Massive-Activations-HLA
