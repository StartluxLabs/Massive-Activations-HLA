# Optional large-scale pretrained hybrid models.
# These models may require separate environments, trust_remote_code=True, and
# substantial GPU memory. Paths can point to local caches; otherwise hf_id is used.
models:
  qwen35_35b_a3b:
    family: Qwen3.5
    adapter: qwen
    hf_id: Qwen/Qwen3.5-35B-A3B
    path: ${MODERN_MODEL_ROOT:-}/Qwen3.5-35B-A3B
    scale: 35B-A3B
    trust_remote_code: true
    metadata:
      group: modern_qwen

  qwen35_122b_a10b:
    family: Qwen3.5
    adapter: qwen
    hf_id: Qwen/Qwen3.5-122B-A10B
    path: ${MODERN_MODEL_ROOT:-}/Qwen3.5-122B-A10B
    scale: 122B-A10B
    trust_remote_code: true
    metadata:
      group: modern_qwen

  kimi_linear_48b_base:
    family: Kimi-Linear
    adapter: kimi
    hf_id: moonshotai/Kimi-Linear-48B-A3B-Base
    path: ${MODERN_MODEL_ROOT:-}/Kimi-Linear-48B-A3B-Base
    scale: 48B-A3B
    trust_remote_code: true
    metadata:
      group: modern_kimi

  zamba2_7b:
    family: Zamba2
    adapter: zamba
    hf_id: Zyphra/Zamba2-7B
    path: ${MODERN_MODEL_ROOT:-}/Zamba2-7B
    scale: 7B
    trust_remote_code: true
    metadata:
      group: modern_zamba

  nemotron_h_56b:
    family: Nemotron-H
    adapter: nemotron
    hf_id: nvidia/Nemotron-H-56B-Base-8K
    path: ${MODERN_MODEL_ROOT:-}/Nemotron-H-56B-Base-8K
    scale: 56B
    trust_remote_code: true
    metadata:
      group: modern_nemotron
